<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>BinaryRepair · 可验证的二进制修复</title>
  <link rel="icon" type="image/svg+xml" href="/ui/assets/mark-dark.svg">
  <link rel="stylesheet" href="/ui/welcome/welcome.css">
  <script type="module" src="/ui/welcome/welcome.mjs"></script>
</head>
<body>
  <a class="skip" href="#main">跳转到主内容</a>
  <div class="backdrop" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
    <span class="grid"></span>
  </div>

  <header class="topbar">
    <a class="brand" href="/welcome">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2.8 20 6v5.6c0 4.5-3.2 7.2-8 9.6-4.8-2.4-8-5.1-8-9.6V6l8-3.2Z"/>
        <path d="m9 12 2 2 4-4"/>
      </svg>
      <strong>BinaryRepair</strong>
    </a>
    <nav class="top-actions" aria-label="Primary">
      <a class="quiet" href="/ui/" data-zh="档案库" data-en="Archive">档案库</a>
      <a class="quiet" href="/guide" data-zh="操作指南" data-en="Guide">操作指南</a>
      <button class="lang" type="button" id="language" aria-label="Switch language">EN</button>
    </nav>
  </header>

  <main id="main">
    <p class="announce">
      <span class="spark" aria-hidden="true">✦</span>
      <span data-zh="本地运行 · 两条修复路线 · 一套确定性验收"
        data-en="Local session · two repair routes · one deterministic verdict">本地运行 · 两条修复路线 · 一套确定性验收</span>
    </p>

    <h1>
      <span data-zh="修复，直到证据成立" data-en="Repair, until the evidence holds">修复，直到证据成立</span>
    </h1>
    <p class="lede"
      data-zh="描述一个已知漏洞，上传二进制，和修复助手一起审阅契约、运行两条路线；最终结论与证据归档在档案库。"
      data-en="Describe one known defect, attach the binary, review the contract and run both routes. The verdict and evidence are archived.">
      描述一个已知漏洞，上传二进制，和修复助手一起审阅契约、运行两条路线；最终结论与证据归档在档案库。
    </p>

    <a class="composer-card" href="/ui/chat/" aria-label="Start a repair conversation">
      <span class="composer-placeholder"
        data-zh="描述缺陷，或直接开始一次修复…" data-en="Describe the defect, or start a repair…">描述缺陷，或直接开始一次修复…</span>
      <span class="composer-bottom">
        <span class="tag"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 3h8l4 4v14H6zM14 3v5h4M9 13h6m-6 4h6"/></svg>
          <span data-zh="上传二进制" data-en="Attach binary">上传二进制</span>
        </span>
        <span class="tag"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 5h14v11h-8l-4 3v-3H5z"/></svg>
          <span data-zh="审阅契约" data-en="Review contract">审阅契约</span>
        </span>
        <span class="tag"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 19h14M5 5h14v9H5z"/></svg>
          <span data-zh="归档证据" data-en="Archive evidence">归档证据</span>
        </span>
        <span class="send" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
        </span>
      </span>
    </a>

    <div class="shortcuts">
      <a class="pill" href="/ui/chat/">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 5h14v11h-8l-4 3v-3H5z"/></svg>
        <span data-zh="开始对话" data-en="Open conversation">开始对话</span>
      </a>
      <a class="pill" href="/ui/">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 10h8m-8 4h6"/></svg>
        <span data-zh="打开档案库" data-en="Open archive">打开档案库</span>
      </a>
      <a class="pill" href="/guide">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 3h9l3 3v15H6zM15 3v4h4M9 12h7m-7 4h5"/></svg>
        <span data-zh="阅读指南" data-en="Read the guide">阅读指南</span>
      </a>
    </div>

    <p class="trust"
      data-zh="界面只呈现结果。结论由确定性验收引擎计算，模型意见不构成证据。"
      data-en="The interface only renders results. The deterministic acceptance engine decides; model text is never evidence.">
      界面只呈现结果。结论由确定性验收引擎计算，模型意见不构成证据。
    </p>
  </main>

  <footer class="footer">
    <span data-zh="本地优先 · 无外部 CDN" data-en="Local-first · no external CDN">本地优先 · 无外部 CDN</span>
    <span aria-hidden="true">·</span>
    <a href="/ui/" data-zh="档案库" data-en="Archive">档案库</a>
    <span aria-hidden="true">·</span>
    <a href="/ui/chat/" data-zh="对话" data-en="Conversation">对话</a>
  </footer>
</body>
</html>

<div class="theme-switch" role="group" aria-label="主题" data-theme-switch>
  <button type="button" class="theme-btn" data-theme-set="light" title="白天模式" aria-label="白天模式" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2.6v2.2M12 19.2v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"></path>
    </svg>
  </button>
  <button type="button" class="theme-btn" data-theme-set="dark" title="夜晚模式" aria-label="夜晚模式" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20.4 14.6A8.6 8.6 0 1 1 9.4 3.6a6.9 6.9 0 0 0 11 11Z"></path>
    </svg>
  </button>
  <button type="button" class="theme-btn" data-theme-set="system" title="跟随系统" aria-label="跟随系统" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="4.5" width="18" height="12.5" rx="2"></rect>
      <path d="M9 20.5h6M12 17v3.5"></path>
    </svg>
  </button>
</div>

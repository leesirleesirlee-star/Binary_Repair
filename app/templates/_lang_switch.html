<div class="ds-lang-switch" data-lang-switch>
  <button type="button" class="ds-lang-button" aria-haspopup="listbox" aria-expanded="false">
    <span class="ds-lang-glyph" aria-hidden="true">◈</span>
    <span data-lang-current>简体中文</span>
    <span class="ds-lang-caret" aria-hidden="true"></span>
  </button>
  <div class="ds-lang-menu" role="listbox" aria-label="Language" hidden>
    <button type="button" data-lang-set="zh-Hans" role="option">简体中文</button>
    <button type="button" data-lang-set="zh-Hant" role="option">繁體中文</button>
    <button type="button" data-lang-set="en" role="option">English</button>
    <button type="button" data-lang-set="ja" role="option">日本語</button>
    <button type="button" data-lang-set="ko" role="option">한국어</button>
    <button type="button" data-lang-set="fr" role="option">Français</button>
    <button type="button" data-lang-set="it" role="option">Italiano</button>
    <button type="button" data-lang-set="pt" role="option">Português</button>
    <button type="button" data-lang-set="es" role="option">Español</button>
  </div>
</div>
